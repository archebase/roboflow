[package]
name = "roboflow-pipeline"
version = "0.2.0"
edition = "2024"
authors = ["Strata Contributors"]
license = "MulanPSL-2.0"
repository = "https://github.com/archebase/roboflow"
description = "Processing pipeline for roboflow - parallel decoding and transformation"
autoexamples = false
# Note: Doctests disabled after workspace refactoring - they reference old `roboflow::pipeline::*` paths
# The `doc = false` below disables doc building to avoid doctest failures
[package.metadata.docs]
rs = false

[dependencies]
roboflow-core = { path = "../roboflow-core", version = "0.2.0" }
roboflow-storage = { path = "../roboflow-storage", version = "0.2.0" }
roboflow-dataset = { path = "../roboflow-dataset", version = "0.2.0" }

# External dependencies from robocodec
robocodec = { git = "https://github.com/archebase/robocodec", rev = "5a8e11b" }

# Compression
zstd = "0.13"
lz4_flex = "0.11"
bzip2 = "0.4"
crc32fast = "1.4"

# Parallel processing
rayon = "1.10"
crossbeam-channel = "0.5"
crossbeam = "0.8"
crossbeam-queue = "0.3"

# Arena allocation
bumpalo = "3.16"
bytemuck = "1.15"

# System detection
num_cpus = "1.16"
sysinfo = "0.30"

# Serialization
byteorder = "1.5"
libc = "0.2"
memmap2 = "0.9"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

[features]
# GPU compression (experimental, Linux only)
gpu = []
# CPU feature detection (x86_64 only)
cpuid = []
# io-uring based I/O (Linux only)
io-uring-io = []

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"
criterion = "0.5"
