[package]
name = "roboflow-pipeline"
version = "0.2.0"
edition = "2021"
authors = ["ArcheBase Authors"]
license = "MulanPSL-2.0"
repository = "https://github.com/archebase/roboflow"
description = "Processing pipeline for roboflow - parallel decoding and transformation"
autoexamples = false

[dependencies]
roboflow-core = { workspace = true }
roboflow-dataset = { workspace = true, optional = true }
roboflow-sources = { workspace = true }
roboflow-sinks = { workspace = true }
robocodec = { workspace = true }

tokio = { workspace = true }
async-trait = { workspace = true }

# Compression
zstd = "0.13"
lz4_flex = "0.11"
bzip2 = "0.4"
crc32fast = "1.4"

# Parallel processing
rayon = "1.10"
crossbeam-channel = "0.5"
crossbeam = "0.8"
crossbeam-queue = "0.3"

# Arena allocation
bumpalo = "3.16"
bytemuck = "1.15"

# Serialization / low-level
byteorder = "1.5"
libc = "0.2"
memmap2 = "0.9"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

[features]
# CPU feature detection (x86_64 only)
cpuid = []
# Legacy dataset support (optional, for backward compatibility)
dataset = ["dep:roboflow-dataset"]

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"
criterion = "0.5"
