[package]
name = "roboflow-video"
version = "0.2.0"
edition = "2024"
authors = ["ArcheBase Contributors"]
license = "MulanPSL-2.0"
repository = "https://github.com/archebase/roboflow"
description = "Video encoding for roboflow - MP4, hardware acceleration, multi-camera"

[dependencies]
# Internal crates
roboflow-core = { workspace = true }
roboflow-storage = { workspace = true }

# Video encoding via rsmpeg (native FFmpeg bindings)
rsmpeg = { version = "0.18", features = ["link_system_ffmpeg"] }

# Image decoding (for converting encoded images to RGB)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Fast SIMD-accelerated JPEG decoder (2-4x faster than image crate)
zune-jpeg = "0.4"

# PNG for depth image fallback
png = "0.17"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# Concurrency
crossbeam-channel = "0.5"
num_cpus = "1.16"

# Async runtime
tokio = { workspace = true }

# Bytes for zero-copy data transfer
bytes = "1"

[features]
default = []

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
num_cpus = "1.16"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "simd_benchmark"
harness = false

[[bench]]
name = "pipeline_benchmark"
harness = false
