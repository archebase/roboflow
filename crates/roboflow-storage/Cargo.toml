[package]
name = "roboflow-storage"
version = "0.2.0"
edition = "2024"
authors = ["Strata Contributors"]
license = "MulanPSL-2.0"
repository = "https://github.com/archebase/roboflow"
description = "Storage abstraction layer for roboflow - local filesystem, S3, OSS"

[dependencies]
roboflow-core = { path = "../roboflow-core", version = "0.2.0" }

# Cloud storage - ALWAYS AVAILABLE (no feature flag)
object_store = { version = "0.11", features = ["aws"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "sync"] }
url = "2.5"
bytes = "1.7"
async-trait = "0.1"

# Error handling
thiserror = "1.0"

# Crossbeam channels for caching
crossbeam-channel = "0.5"

# Serde for serialization
serde = { version = "1.0", features = ["derive"] }

# TOML for config file parsing
toml = "0.8"

# Tracing for logging
tracing = "0.1"

# Chrono for datetime handling (cloud storage timestamps)
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"
