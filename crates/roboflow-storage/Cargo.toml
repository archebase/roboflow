[package]
name = "roboflow-storage"
version = "0.2.0"
edition = "2024"
authors = ["Strata Contributors"]
license = "MulanPSL-2.0"
repository = "https://github.com/archebase/roboflow"
description = "Storage abstraction layer for roboflow - local filesystem, S3, OSS"

[dependencies]
roboflow-core = { workspace = true }

# Cloud storage (always available)
object_store = { version = "0.11", features = ["aws"] }
url = "2.5"
bytes = "1.7"

# Async
tokio = { workspace = true }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# Temp file creation (for streaming uploads)
tempfile = "3.10"

# Concurrency
crossbeam-channel = "0.5"

# Datetime (cloud storage timestamps)
chrono = { workspace = true }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"
