[package]
name = "roboflow-sources"
version = "0.2.0"
edition = "2024"
authors = ["ArcheBase Authors"]
license = "MulanPSL-2.0"
repository = "https://github.com/archebase/roboflow"
description = "Source plugins for roboflow data pipeline"

[dependencies]
robocodec = { workspace = true }
roboflow-core = { path = "../roboflow-core" }
roboflow-storage = { path = "../roboflow-storage" }
async-trait = { workspace = true }
tokio = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

[features]
default = []
