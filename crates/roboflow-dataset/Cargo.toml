[package]
name = "roboflow-dataset"
version = "0.2.0"
edition = "2024"
authors = ["Strata Contributors"]
license = "MulanPSL-2.0"
repository = "https://github.com/archebase/roboflow"
description = "Dataset writers for roboflow - LeRobot v2.1, Parquet (always available)"

[dependencies]
# Internal crates
roboflow-core = { workspace = true }
roboflow-storage = { workspace = true }
robocodec = { workspace = true }

# Parquet (always available)
polars = { version = "0.41", features = ["parquet"] }
png = "0.17"

# Image decoding (required for LeRobot and streaming conversion)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Video encoding via FFmpeg (optional, requires system library)
ffmpeg-next = { version = "6.1", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Concurrency
crossbeam-channel = "0.5"
num_cpus = "1.16"
rayon = "1.10"

# Async runtime (S3 streaming decoder)
tokio = { workspace = true }

# Episode IDs
uuid = { version = "1.10", features = ["v4", "serde"] }

[features]
default = []

# Enable video encoding via FFmpeg (requires ffmpeg installed on system)
video = ["dep:ffmpeg-next"]

# CUDA pinned memory for zero-copy GPU transfers (requires cudarc)
cuda-pinned = []

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"
