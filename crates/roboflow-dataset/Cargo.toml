[package]
name = "roboflow-dataset"
version = "0.2.0"
edition = "2024"
authors = ["Strata Contributors"]
license = "MulanPSL-2.0"
repository = "https://github.com/archebase/roboflow"
description = "Dataset writers for roboflow - LeRobot v2.1, Parquet (always available)"

[dependencies]
# Internal crates
roboflow-core = { workspace = true }
roboflow-storage = { workspace = true }
robocodec = { workspace = true }

# Parquet (always available)
polars = { version = "0.41", features = ["parquet"] }
png = "0.17"

# Image decoding (required for LeRobot and streaming conversion)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Video encoding via rsmpeg (optional, requires FFmpeg 8.x libraries)
# Note: rsmpeg is currently unused - video encoding uses FFmpeg CLI
# Kept for potential future native FFmpeg bindings integration
rsmpeg = { version = "0.18", optional = true, features = ["link_system_ffmpeg"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Concurrency
crossbeam-channel = "0.5"
num_cpus = "1.16"
rayon = "1.10"

# Async runtime (S3 streaming decoder)
tokio = { workspace = true }

# Episode IDs
uuid = { version = "1.10", features = ["v4", "serde"] }

[features]
default = []

# Video encoding uses FFmpeg CLI (always available)
# The `video` feature is kept for compatibility but does nothing
# Native rsmpeg integration is planned for future optimization
video = []

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"
