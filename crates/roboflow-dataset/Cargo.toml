[package]
name = "roboflow-dataset"
version = "0.2.0"
edition = "2024"
authors = ["Strata Contributors"]
license = "MulanPSL-2.0"
repository = "https://github.com/archebase/roboflow"
description = "Dataset formats and conversion for robotics training data"

[dependencies]
roboflow-core = { workspace = true }
roboflow-storage = { workspace = true }
roboflow-media = { workspace = true }
robocodec = { workspace = true }

polars = { version = "0.41", features = ["parquet", "lazy", "diagonal_concat"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
tracing = "0.1"
crossbeam-channel = "0.5"
tokio = { workspace = true }
async-trait = { workspace = true }
uuid = { version = "1.10", features = ["v4", "serde"] }
mcap = "0.24"
tempfile = "3.10"

[features]
default = []

[dev-dependencies]
pretty_assertions = "1.4"
proptest = "1.5"
criterion = "0.5"

[[bench]]
name = "frame_alignment"
harness = false

[[test]]
name = "lerobot"
path = "tests/lerobot/mod.rs"
