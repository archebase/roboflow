[package]
name = "roboflow-dataset"
version = "0.2.0"
edition = "2024"
authors = ["Strata Contributors"]
license = "MulanPSL-2.0"
repository = "https://github.com/archebase/roboflow"
description = "Dataset formats and conversion for robotics training data"

[dependencies]
roboflow-core = { workspace = true }
roboflow-storage = { workspace = true }
roboflow-executor = { workspace = true }
roboflow-media = { workspace = true }
robocodec = { workspace = true }

polars = { version = "0.41", features = ["parquet", "lazy", "diagonal_concat"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"
rayon = "1.10"
num_cpus = "1.16"
tokio = { workspace = true }
async-trait = { workspace = true }
futures = "0.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
mcap = "0.24"
rosbag = "0.6"
chrono = { workspace = true }
zstd = "0.13"
lz4_flex = "0.11"
bzip2 = "0.4"
bytes = "1"
memmap2 = "0.9"
hex = "0.4"
regex = "1.10"
tempfile = "3.10"

[features]
default = []

[dev-dependencies]
pretty_assertions = "1.4"
proptest = "1.5"
criterion = "0.5"

[[bench]]
name = "frame_alignment"
harness = false

[[test]]
name = "lerobot"
path = "tests/lerobot/mod.rs"
