[package]
name = "roboflow-distributed"
version = "0.2.0"
edition = "2024"
authors = ["ArcheBase Authors"]
license = "MulanPSL-2.0"
repository = "https://github.com/archebase/roboflow"
description = "Distributed coordination for roboflow - TiKV backend"

[dependencies]
roboflow-core = { workspace = true }
roboflow-storage = { workspace = true }

# TiKV
tikv-client = "0.3"
futures = "0.3"

# Async runtime (needs signal, time for graceful shutdown)
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Serialization
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"

# Datetime
chrono = { workspace = true }

# Async traits
async-trait = { workspace = true }

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# Utilities
fastrand = "2.1"
glob = "0.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
gethostname = "0.4"

# Parquet (merge operations)
polars = { version = "0.41", features = ["parquet", "lazy", "diagonal_concat"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
