[package]
name = "roboflow-distributed"
version = "0.2.0"
edition = "2024"
authors = ["Strata Contributors"]
license = "MulanPSL-2.0"
repository = "https://github.com/archebase/roboflow"
description = "Distributed coordination for roboflow - TiKV backend"

[features]
default = ["distributed"]
distributed = []

[dependencies]
roboflow-core = { path = "../roboflow-core", version = "0.2.0" }
roboflow-storage = { path = "../roboflow-storage", version = "0.2.0" }
roboflow-dataset = { path = "../roboflow-dataset", version = "0.2.0" }

# TiKV client
tikv-client = "0.3"
futures = "0.3"

# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "sync"] }
tokio-util = "0.7"

# Serialization
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# Random for jitter
fastrand = "2.1"

# Glob patterns for file filtering
glob = "0.3"

# UUID generation
uuid = { version = "1.10", features = ["v4", "serde"] }

# Hostname detection
gethostname = "0.4"

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"
