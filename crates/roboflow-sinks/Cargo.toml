[package]
name = "roboflow-sinks"
version = "0.2.0"
edition = "2024"
authors = ["ArcheBase Authors"]
license = "MulanPSL-2.0"
repository = "https://github.com/archebase/roboflow"
description = "Sink plugins for roboflow data pipeline"

[dependencies]
roboflow-core = { path = "../roboflow-core" }
roboflow-dataset = { workspace = true }
roboflow-storage = { workspace = true }

chrono = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

[features]
default = []
