# Secret template for cloud storage credentials.
#
# For production use, create this secret using:
#   kubectl create secret generic roboflow-secrets \
#     --from-literal=OSS_ACCESS_KEY_ID=your_key_id \
#     --from-literal=OSS_ACCESS_KEY_SECRET=your_secret \
#     --namespace=roboflow
#
# For S3, use:
#   kubectl create secret generic roboflow-secrets \
#     --from-literal=AWS_ACCESS_KEY_ID=your_key_id \
#     --from-literal=AWS_SECRET_ACCESS_KEY=your_secret \
#     --from-literal=AWS_REGION=us-east-1 \
#     --namespace=roboflow
#
# Alternatively, use IRSA (IAM Roles for Service Accounts) or
# workload identity for cloud providers, which is recommended
# for production deployments.

---
apiVersion: v1
kind: Secret
metadata:
  name: roboflow-secrets
  namespace: roboflow
type: Opaque
stringData:
  # Alibaba OSS credentials (for OSS storage backend)
  # OSS_ACCESS_KEY_ID: ""
  # OSS_ACCESS_KEY_SECRET: ""
  # OSS_ENDPOINT: ""

  # AWS S3 credentials (for S3 storage backend)
  # AWS_ACCESS_KEY_ID: ""
  # AWS_SECRET_ACCESS_KEY: ""
  # AWS_REGION: "us-east-1"

  # TiKV TLS credentials (if using TLS)
  # TIKV_CA_PATH: ""
  # TIKV_CERT_PATH: ""
  # TIKV_KEY_PATH: ""
