---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roboflow-worker
  namespace: roboflow
  labels:
    app: roboflow
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: roboflow
      component: worker
  template:
    metadata:
      labels:
        app: roboflow
        component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # Use anti-affinity to spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - roboflow
                    - key: component
                      operator: In
                      values:
                        - worker
                topologyKey: kubernetes.io/hostname

      # Init container to wait for TiKV to be ready
      initContainers:
        - name: wait-for-tikv
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z tikv.tikv.svc.cluster.local 2379; do
                echo "Waiting for TiKV..."
                sleep 2
              done
              echo "TiKV is ready!"

      containers:
        # Worker container
        - name: worker
          image: roboflow:latest  # Replace with actual image
          imagePullPolicy: IfNotPresent
          command:
            - /roboflow
            - worker
          envFrom:
            - configMapRef:
                name: roboflow-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Secret-based credentials (optional - can use IRSA instead)
            # - name: OSS_ACCESS_KEY_ID
            #   valueFrom:
            #     secretKeyRef:
            #       name: roboflow-secrets
            #       key: OSS_ACCESS_KEY_ID
            # - name: OSS_ACCESS_KEY_SECRET
            #   valueFrom:
            #     secretKeyRef:
            #       name: roboflow-secrets
            #       key: OSS_ACCESS_KEY_SECRET
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          # Resource requests and limits
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
            limits:
              cpu: "8"
              memory: "32Gi"
              # nvidia.com/gpu: "1"  # Uncomment for GPU support
          # Liveness probe - checks if container is alive
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness probe - checks if container is ready to accept work
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Startup probe - gives container time to start
          startupProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30  # 5 * 30 = 150 seconds max startup time

        # Scanner sidecar container (single leader via distributed lock)
        - name: scanner
          image: roboflow:latest  # Same image as worker
          imagePullPolicy: IfNotPresent
          command:
            - /roboflow
            - scanner
          envFrom:
            - configMapRef:
                name: roboflow-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HEALTH_PORT
              value: "8081"
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10

      # Restart policy for pods
      restartPolicy: Always

  # Rolling update strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

---
# Service for health checks and metrics
apiVersion: v1
kind: Service
metadata:
  name: roboflow-worker
  namespace: roboflow
  labels:
    app: roboflow
    component: worker
spec:
  selector:
    app: roboflow
    component: worker
  ports:
    - name: health
      port: 8080
      targetPort: health
      protocol: TCP
  type: ClusterIP
