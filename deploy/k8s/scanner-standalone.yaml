# Optional: Standalone Scanner Deployment
#
# In the default configuration, the scanner runs as a sidecar in the worker pod.
# This manifest is provided for running the scanner as a separate deployment,
# which can be useful for:
# - Independent scaling of scanner from workers
# - Running scanner on a separate node pool
# - Testing scanner without worker overhead

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roboflow-scanner
  namespace: roboflow
  labels:
    app: roboflow
    component: scanner
spec:
  replicas: 1  # Single replica - uses leader election via TiKV
  selector:
    matchLabels:
      app: roboflow
      component: scanner
  template:
    metadata:
      labels:
        app: roboflow
        component: scanner
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # Init container to wait for TiKV to be ready
      initContainers:
        - name: wait-for-tikv
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z tikv.tikv.svc.cluster.local 2379; do
                echo "Waiting for TiKV..."
                sleep 2
              done
              echo "TiKV is ready!"

      containers:
        - name: scanner
          image: roboflow:latest  # Replace with actual image
          imagePullPolicy: IfNotPresent
          command:
            - /roboflow
            - scanner
          envFrom:
            - configMapRef:
                name: roboflow-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10

      restartPolicy: Always

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # Keep at least 1 pod during updates
      maxSurge: 1

---
# Service for standalone scanner
apiVersion: v1
kind: Service
metadata:
  name: roboflow-scanner
  namespace: roboflow
  labels:
    app: roboflow
    component: scanner
spec:
  selector:
    app: roboflow
    component: scanner
  ports:
    - name: health
      port: 8080
      targetPort: health
      protocol: TCP
  type: ClusterIP

---
# PodDisruptionBudget for scanner
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: roboflow-scanner-pdb
  namespace: roboflow
spec:
  minAvailable: 0  # Allow scanner to be disrupted (will re-elect leader)
  selector:
    matchLabels:
      app: roboflow
      component: scanner
