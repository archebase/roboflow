---
# Template for one-shot conversion Jobs
# This can be used to run individual conversion tasks
apiVersion: batch/v1
kind: Job
metadata:
  name: roboflow-conversion
  namespace: roboflow
  labels:
    app.kubernetes.io/name: roboflow-job
    app.kubernetes.io/component: job
    app.kubernetes.io/part-of: roboflow
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 7200  # 2 hours max
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roboflow-job
        app.kubernetes.io/component: job
        app.kubernetes.io/part-of: roboflow
    spec:
      restartPolicy: OnFailure

      containers:
      - name: converter
        image: ghcr.io/archebase/roboflow-worker:0.2.0
        imagePullPolicy: IfNotPresent

        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: roboflow-config

        # Environment variables from Secrets
        env:
        - name: OSS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: roboflow-storage-credentials
              key: oss-access-key-id
              optional: true
        - name: OSS_ACCESS_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: roboflow-storage-credentials
              key: oss-access-key-secret
              optional: true
        - name: OSS_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: roboflow-storage-credentials
              key: oss-endpoint
              optional: true

        # Command - customize based on your conversion needs
        command: ["/usr/local/bin/convert"]
        args:
        - "s3://roboflow-raw/input.bag"
        - "--output"
        - "s3://roboflow-datasets/output"
        - "--format"
        - "lerobot"

        # Resource requests and limits
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "8"
            memory: "16Gi"

      # Optional: Use a node selector for specific hardware
      # nodeSelector:
      #   disk: ssd
