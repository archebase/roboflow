---
apiVersion: v1
kind: Service
metadata:
  name: roboflow-worker
  namespace: roboflow
  labels:
    app.kubernetes.io/name: roboflow-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: roboflow
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: roboflow-worker
    app.kubernetes.io/component: worker
  ports:
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
