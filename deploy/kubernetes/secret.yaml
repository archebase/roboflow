---
# Secret template for Alibaba Cloud OSS credentials
# Create the actual secret using:
# kubectl create secret generic roboflow-oss-credentials \
#   --from-literal=access-key-id=YOUR_ACCESS_KEY_ID \
#   --from-literal=access-key-secret=YOUR_ACCESS_KEY_SECRET \
#   --namespace=roboflow
#
# Or for S3:
# kubectl create secret generic roboflow-s3-credentials \
#   --from-literal=aws-access-key-id=YOUR_ACCESS_KEY_ID \
#   --from-literal=aws-secret-access-key=YOUR_SECRET_ACCESS_KEY \
#   --namespace=roboflow
apiVersion: v1
kind: Secret
metadata:
  name: roboflow-storage-credentials
  namespace: roboflow
  labels:
    app.kubernetes.io/name: roboflow
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: roboflow
type: Opaque
stringData:
  # Alibaba Cloud OSS credentials
  # oss-access-key-id: ""
  # oss-access-key-secret: ""
  # oss-endpoint: ""

  # AWS S3 credentials (optional)
  # aws-access-key-id: ""
  # aws-secret-access-key: ""
  # aws-region: ""
  # aws-endpoint: ""  # For S3-compatible services (MinIO, etc.)

---
# Secret template for TiKV connection (if authentication is required)
apiVersion: v1
kind: Secret
metadata:
  name: roboflow-tikv-config
  namespace: roboflow
  labels:
    app.kubernetes.io/name: roboflow
    app.kubernetes.io/component: tikv
    app.kubernetes.io/part-of: roboflow
type: Opaque
stringData:
  # TiKV PD endpoints (comma-separated list)
  # pd-endpoints: "tikv-pd:2379"

  # TiKV security options (if using TLS)
  # ca-path: ""
  # cert-path: ""
  # key-path: ""
