---
# Role for worker pods to manage Jobs and ConfigMaps
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: roboflow-worker
  namespace: roboflow
  labels:
    app.kubernetes.io/name: roboflow-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: roboflow
rules:
  # Allow creating and managing Jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Allow managing ConfigMaps for configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

  # Allow reading Secrets for credentials
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

  # Allow reading Pods for status checking
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
# RoleBinding to bind the Role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: roboflow-worker
  namespace: roboflow
  labels:
    app.kubernetes.io/name: roboflow-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: roboflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: roboflow-worker
subjects:
  - kind: ServiceAccount
    name: roboflow-worker
    namespace: roboflow
