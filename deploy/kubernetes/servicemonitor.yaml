---
# ServiceMonitor for Prometheus scraping
# Requires kube-prometheus-stack or similar to be installed
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: roboflow-worker
  namespace: roboflow
  labels:
    app.kubernetes.io/name: roboflow-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: roboflow
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: roboflow-worker
  namespaceSelector:
    matchNames:
    - roboflow
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    scheme: http
