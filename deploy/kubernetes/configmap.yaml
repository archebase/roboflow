---
apiVersion: v1
kind: ConfigMap
metadata:
  name: roboflow-config
  namespace: roboflow
  labels:
    app.kubernetes.io/name: roboflow
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: roboflow
    app.kubernetes.io/version: "0.2.0"
data:
  # Logging configuration
  RUST_LOG: "info"
  RUST_BACKTRACE: "1"

  # TiKV PD endpoints for distributed coordination
  TIKV_PD_ENDPOINTS: "roboflow-tikv-pd:2379"

  # Default storage backend (file://, s3://, oss://)
  STORAGE_BACKEND: "s3://"

  # S3/OSS configuration
  STORAGE_ENDPOINT: "http://roboflow-minio:9000"
  STORAGE_REGION: "us-east-1"

  # Bucket names
  INPUT_BUCKET: "roboflow-raw"
  OUTPUT_BUCKET: "roboflow-datasets"
  TEMP_BUCKET: "roboflow-temp"

  # Pipeline configuration
  NUM_THREADS: "4"
  BATCH_SIZE: "100"
  COMPRESSION_LEVEL: "default"

  # Checkpoint configuration (for distributed processing)
  CHECKPOINT_INTERVAL_SECONDS: "60"
  HEARTBEAT_INTERVAL_SECONDS: "30"

  # Dataset format configuration
  DATASET_FORMAT: "lerobot"
  VIDEO_FORMAT: "mp4"
  VIDEO_CODEC: "h264"

  # Feature flags
  ENABLE_GPU: "false"
  ENABLE_HDF5: "true"
  ENABLE_PARQUET: "true"
