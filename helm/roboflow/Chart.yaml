apiVersion: v2
name: roboflow
description: Distributed data transformation pipeline for robotics bag/MCAP files
type: application
version: 0.2.0
appVersion: "0.2.0"
keywords:
  - robotics
  - data-processing
  - mcap
  - ros
  - lerobot
home: https://github.com/archebase/roboflow
sources:
  - https://github.com/archebase/roboflow
maintainers:
  - name: ArcheBase
    email: info@archebase.org
icon: https://raw.githubusercontent.com/archebase/roboflow/main/docs/logo.png
annotations:
  artifacthub.io/category: networking
  artifacthub.io/license: MulanPSL-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/archebase/roboflow/blob/main/README.md
    - name: Support
      url: https://github.com/archebase/roboflow/issues
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "false"
dependencies:
  - name: redis
    version: "20.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
    alias: redis
  - name: minio
    version: "14.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
    alias: minio
  - name: tikv
    version: "0.1.x"
    repository: https://charts.pingcap.org
    condition: tikv.enabled
    alias: tikv
