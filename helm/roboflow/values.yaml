# Default values for roboflow Helm chart
# This is a YAML-formatted file.

# Global settings
global:
  # Image registry to use for all images
  imageRegistry: ""

  # Common annotations for all deployed resources
  commonAnnotations: {}
  #  annotation-key: "annotation-value"

  # Common labels for all deployed resources
  commonLabels: {}
  #  label-key: "label-value"

# Image configuration
image:
  registry: ghcr.io
  repository: archebase/roboflow-worker
  tag: "0.2.0"
  pullPolicy: IfNotPresent
  # Image pull secrets
  pullSecrets: []
  # - name: my-registry-secret

# Worker deployment configuration
worker:
  # Number of worker replicas
  replicas: 2

  # Pod annotations
  podAnnotations: {}

  # Pod labels
  podLabels: {}

  # Security context for the pod
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  # Security context for the container
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
      - ALL
    runAsNonRoot: true
    runAsUser: 1001

  # Command and arguments for the worker container
  command:
  - "/usr/local/bin/convert"
  args:
  - "--help"

  # Environment variables
  env:
  # - name: CUSTOM_VAR
  #   value: "custom-value"

  # Environment variables from ConfigMap
  envFrom: []

  # Resource requests and limits
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

  # Node selector
  nodeSelector: {}
  #   disk: ssd

  # Tolerations
  tolerations: []
  # - key: nvidia.com/gpu
  #   operator: Exists
  #   effect: NoSchedule

  # Affinity rules
  affinity: {}
  # podAntiAffinity:
  #   preferredDuringSchedulingIgnoredDuringExecution:
  #   - weight: 100
  #     podAffinityTerm:
  #       labelSelector:
  #         matchExpressions:
  #         - key: app.kubernetes.io/name
  #           operator: In
  #           values:
  #           - roboflow-worker
  #       topologyKey: kubernetes.io/hostname

  # Pod management policy
  podManagementPolicy: OrderedReady

  # Priority class name
  # priorityClassName: high-priority

  # Topology spread constraints
  topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: DoNotSchedule
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: roboflow-worker

  # Service account configuration
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    #   eks.amazonaws.com/role-arn: arn:aws:iam::1234567890:role/role-name

  # RBAC configuration
  rbac:
    create: true

  # Health probe configuration
  livenessProbe:
    exec:
      command:
      - /usr/local/bin/convert
      - --version
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    exec:
      command:
      - /usr/local/bin/convert
      - --version
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  startupProbe:
    exec:
      command:
      - /usr/local/bin/convert
      - --version
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30

  # Service configuration
  service:
    type: ClusterIP
    clusterIP: None
    annotations: {}
    ports:
      metrics:
        port: 9090
        protocol: TCP

# HorizontalPodAutoscaler configuration
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 100
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 10
        periodSeconds: 30
      selectPolicy: Max

# PodDisruptionBudget configuration
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# ServiceMonitor configuration for Prometheus
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  namespace: []
  relabelings: []
  metricRelabelings: []

# ConfigMap configuration
config:
  # Logging configuration
  logLevel: info
  rustBacktrace: "1"

  # TiKV configuration
  tikv:
    pdEndpoints: "roboflow-tikv-pd:2379"
    connectionTimeoutSeconds: 10

  # Storage configuration
  storage:
    backend: "s3://"
    endpoint: "http://roboflow-minio:9000"
    region: "us-east-1"
    inputBucket: "roboflow-raw"
    outputBucket: "roboflow-datasets"
    tempBucket: "roboflow-temp"

  # Pipeline configuration
  pipeline:
    numThreads: "4"
    batchSize: "100"
    compressionLevel: "default"

  # Checkpoint configuration
  checkpoint:
    intervalSeconds: "60"
    heartbeatIntervalSeconds: "30"

  # Dataset configuration
  dataset:
    format: "lerobot"
    videoFormat: "mp4"
    videoCodec: "h264"

  # Feature flags
  features:
    enableGpu: "false"
    enableHdf5: "true"
    enableParquet: "true"

# Secret configuration
secrets:
  # Create secrets from values
  create: true

  # OSS credentials
  oss:
    accessKeyId: ""
    accessKeySecret: ""
    endpoint: ""

  # S3 credentials
  s3:
    accessKeyId: ""
    secretAccessKey: ""
    region: ""
    endpoint: ""

  # Use existing secrets instead of creating new ones
  existingSecrets: {}
  #   storage: roboflow-storage-credentials
  #   tikv: roboflow-tikv-config

# Job configuration (for one-off conversion jobs)
job:
  enabled: false
  backoffLimit: 3
  activeDeadlineSeconds: 7200
  command:
  - "/usr/local/bin/convert"
  args:
  - "s3://roboflow-raw/input.bag"
  - "--output"
  - "s3://roboflow-datasets/output"
  - "--format"
  - "lerobot"
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "8"
      memory: "16Gi"

# Redis configuration (optional)
redis:
  enabled: false
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false

# MinIO configuration (optional)
minio:
  enabled: false
  auth:
    rootUser: minioadmin
    rootPassword: minioadmin
  defaultBuckets: "roboflow-datasets,roboflow-raw,roboflow-temp"
  persistence:
    enabled: false

# TiKV configuration (optional)
tikv:
  enabled: false
  pd:
    replicaCount: 1
    storageClassName: ""
  tikv:
    replicaCount: 1
    storageClassName: ""
