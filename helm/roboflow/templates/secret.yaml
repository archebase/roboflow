{{- if .Values.secrets.create }}
---
# Secret for storage credentials (OSS and S3)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "roboflow.fullname" . }}-storage
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: roboflow
    {{- include "roboflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.oss }}
  oss-access-key-id: {{ .accessKeyId | default "" | quote }}
  oss-access-key-secret: {{ .accessKeySecret | default "" | quote }}
  oss-endpoint: {{ .endpoint | default "" | quote }}
  {{- end }}
  {{- with .Values.secrets.s3 }}
  aws-access-key-id: {{ .accessKeyId | default "" | quote }}
  aws-secret-access-key: {{ .secretAccessKey | default "" | quote }}
  aws-region: {{ .region | default "" | quote }}
  aws-endpoint: {{ .endpoint | default "" | quote }}
  {{- end }}
{{- end }}
