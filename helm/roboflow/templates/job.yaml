{{- if .Values.job.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "roboflow.fullname" . }}-job
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: roboflow-job
    app.kubernetes.io/component: job
    {{- include "roboflow.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roboflow-job
        app.kubernetes.io/component: job
        {{- include "roboflow.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "roboflow.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "roboflow.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.worker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      containers:
      - name: converter
        image: {{ include "roboflow.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.worker.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.job.command }}
        command:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.job.args }}
        args:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
        - name: RUST_LOG
          value: {{ .Values.config.logLevel | quote }}
        - name: RUST_BACKTRACE
          value: {{ .Values.config.rustBacktrace | quote }}
        # OSS credentials
        - name: OSS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecrets.storage | default (printf "%s-storage" (include "roboflow.fullname" .)) }}
              key: oss-access-key-id
              optional: true
        - name: OSS_ACCESS_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecrets.storage | default (printf "%s-storage" (include "roboflow.fullname" .)) }}
              key: oss-access-key-secret
              optional: true
        - name: OSS_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecrets.storage | default (printf "%s-storage" (include "roboflow.fullname" .)) }}
              key: oss-endpoint
              optional: true
        # S3 credentials
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecrets.storage | default (printf "%s-storage" (include "roboflow.fullname" .)) }}
              key: aws-access-key-id
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecrets.storage | default (printf "%s-storage" (include "roboflow.fullname" .)) }}
              key: aws-secret-access-key
              optional: true
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecrets.storage | default (printf "%s-storage" (include "roboflow.fullname" .)) }}
              key: aws-region
              optional: true
        - name: AWS_ENDPOINT_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecrets.storage | default (printf "%s-storage" (include "roboflow.fullname" .)) }}
              key: aws-endpoint
              optional: true
        {{- with .Values.job.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- end }}
