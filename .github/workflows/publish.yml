name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # Required for trusted publishing

jobs:
  build:
    name: Build wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        target: [x86_64]
        include:
          - os: ubuntu-latest
            target: x86_64
            use-zig: true
          - os: windows-latest
            target: x86_64
          - os: macos-latest
            target: x86_64
            use-zig: true
          - os: macos-latest
            target: aarch64
            use-zig: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install zig for cross-compilation
        if: matrix.use-zig
        uses: goto-bus-stop/setup-zig@v2

      - name: Install maturin
        run: pip install maturin[patchelf]
        if: runner.os != 'Windows'

      - name: Install maturin (Windows)
        run: pip install maturin
        if: runner.os == 'Windows'

      - name: Build wheels
        run: |
          TARGET_FLAG=""
          if [ "${{ runner.os }}" == "macOS" ]; then
            if [ "${{ matrix.target }}" == "x86_64" ]; then
              TARGET_FLAG="--target x86_64-apple-darwin"
            fi
          elif [ "${{ runner.os }}" == "Linux" ] && [ "${{ matrix.target }}" == "aarch64" ]; then
            TARGET_FLAG="--target aarch64-unknown-linux-gnu"
          fi
          maturin build --release --strip --features python --out dist --find-interpreter $TARGET_FLAG
        env:
          # Enable zig compilation for aarch64
          PYO3_CROSS: ${{ matrix.use-zig && '1' || '' }}
          PYO3_CROSS_LIB_DIR: ${{ matrix.use-zig && '/usr/aarch64-linux-gnu' || '' }}
        shell: bash

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/

  build-manylinux:
    name: Build manylinux wheels
    runs-on: ubuntu-latest
    container: ghcr.io/pyo3/maturin:main
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        run: maturin build --release --strip --features python --out dist --manylinux 2010+

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [build, build-manylinux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: List built wheels
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true
          verify-metadata: false
          verbose: true

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
