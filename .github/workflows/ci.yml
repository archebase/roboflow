name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  license:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install reuse tool
        run: pip install reuse

      - name: Check REUSE compliance
        run: reuse lint

  rust-lint:
    name: Rust Lint
    needs: license
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting (Rust)
        run: cargo fmt -- --check

      - name: Check formatting (Python)
        run: ruff format --check python/

      - name: Install HDF5
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libhdf5-dev
          elif [ "$RUNNER_OS" == "macOS" ]; then
            # Use HDF5 1.10 as hdf5-sys doesn't support HDF5 2.x yet
            brew install hdf5@1.10
            echo "HDF5_DIR=$(brew --prefix hdf5@1.10)" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  rust-test:
    name: Rust Tests
    needs: rust-lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install HDF5
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libhdf5-dev
          elif [ "$RUNNER_OS" == "macOS" ]; then
            # Use HDF5 1.10 as hdf5-sys doesn't support HDF5 2.x yet
            brew install hdf5@1.10
            echo "HDF5_DIR=$(brew --prefix hdf5@1.10)" >> $GITHUB_ENV
          fi
        shell: bash

      # Note: Do NOT use --all-features or --features python here.
      # PyO3's extension-module feature prevents linking in standalone test binaries.
      # Python bindings are tested separately via maturin in the python job.
      - name: Run tests
        run: cargo test --features dataset-all

  python:
    name: Python Tests
    needs: rust-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pip install maturin[patchelf] pytest pytest-cov

      - name: Build and install Python package
        run: maturin develop --release --features python

      - name: Run Python tests
        run: pytest python/ -v

  lint:
    name: Python Lint
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pip install maturin[patchelf] ruff mypy

      - name: Build and install Python package
        run: maturin develop --release --features python

      - name: Run ruff check (Python linting)
        run: ruff check python/

      - name: Run mypy
        run: mypy python/roboflow

  coverage:
    name: Coverage
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-llvm-cov
        uses: actions/cache@v4
        id: cache-llvm-cov
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: ${{ runner.os }}-cargo-llvm-cov-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-llvm-cov
        if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pip install maturin[patchelf] pytest pytest-cov

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      # Note: Do NOT use --all-features here - PyO3's extension-module prevents linking.
      # Rust coverage excludes python feature; Python coverage is generated separately below.
      - name: Generate Rust coverage
        run: cargo llvm-cov --features dataset-all --workspace --lcov --output-path lcov.info

      - name: Generate Python coverage
        run: |
          maturin develop --release --features python
          pytest python/ --cov=roboflow --cov-report=xml:coverage-python.xml --cov-report=term

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info,./coverage-python.xml
          flags: rust,python
          name: codecov-umbrella
