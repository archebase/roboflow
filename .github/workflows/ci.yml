name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C linker=cc

jobs:
  license:
    name: License Compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install reuse tool
        run: pip install reuse

      - name: Check REUSE compliance
        run: reuse lint

  rust-lint:
    name: Rust Lint
    needs: license
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-key: "robocodec-vcpkg-${{ hashFiles('**/Cargo.lock') }}"

      - name: Check formatting (Rust)
        run: cargo fmt -- --check

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libhdf5-dev pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install hdf5@1.10
          echo "HDF5_DIR=$(brew --prefix hdf5@1.10)" >> $GITHUB_ENV

      - name: Setup vcpkg
        uses: johnwason/vcpkg-action@v7
        id: vcpkg
        with:
          manifest-dir: ${{ github.workspace }}
          triplet: ${{ runner.os == 'Linux' && 'x64-linux' || 'x64-osx' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure vcpkg environment
        run: |
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV
          echo "FFMPEG_DIR=${{ github.workspace }}/vcpkg/installed/${{ runner.os == 'Linux' && 'x64-linux' || 'x64-osx' }}" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${{ github.workspace }}/vcpkg/installed/${{ runner.os == 'Linux' && 'x64-linux' || 'x64-osx' }}/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  rust-test:
    name: Rust Tests
    needs: rust-lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-key: "robocodec-vcpkg-${{ hashFiles('**/Cargo.lock') }}"

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libhdf5-dev pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install hdf5@1.10
          echo "HDF5_DIR=$(brew --prefix hdf5@1.10)" >> $GITHUB_ENV

      - name: Setup vcpkg
        uses: johnwason/vcpkg-action@v7
        id: vcpkg
        with:
          manifest-dir: ${{ github.workspace }}
          triplet: ${{ runner.os == 'Linux' && 'x64-linux' || 'x64-osx' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure vcpkg environment
        run: |
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV
          echo "FFMPEG_DIR=${{ github.workspace }}/vcpkg/installed/${{ runner.os == 'Linux' && 'x64-linux' || 'x64-osx' }}" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${{ github.workspace }}/vcpkg/installed/${{ runner.os == 'Linux' && 'x64-linux' || 'x64-osx' }}/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV

      - name: Run tests
        run: cargo test --features dataset-all

  coverage:
    name: Coverage
    needs: rust-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          cache-key: "robocodec-vcpkg-${{ hashFiles('**/Cargo.lock') }}"

      - name: Cache cargo-llvm-cov
        uses: actions/cache@v4
        id: cache-llvm-cov
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: ${{ runner.os }}-cargo-llvm-cov-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-llvm-cov
        if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libhdf5-dev pkg-config

      - name: Setup vcpkg
        uses: johnwason/vcpkg-action@v7
        id: vcpkg
        with:
          manifest-dir: ${{ github.workspace }}
          triplet: x64-linux
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure vcpkg environment
        run: |
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV
          echo "FFMPEG_DIR=${{ github.workspace }}/vcpkg/installed/x64-linux" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${{ github.workspace }}/vcpkg/installed/x64-linux/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV

      - name: Generate Rust coverage
        run: cargo llvm-cov --features dataset-all --workspace --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          flags: rust
          name: codecov-umbrella

  security:
    name: Security Audit
    needs: license
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-deny
        uses: actions/cache@v4
        id: cache-deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny

      - name: Check dependencies for security advisories
        run: cargo deny check advisories

      - name: Check dependencies for license compliance
        run: cargo deny check licenses

      - name: Check for duplicate dependencies
        run: cargo deny check bans
