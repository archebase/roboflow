name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TIKV_PD_ENDPOINTS: 127.0.0.1:2379
  MINIO_ENDPOINT: http://127.0.0.1:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin

jobs:
  license:
    name: License Compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install reuse tool
        run: pip install reuse

      - name: Check REUSE compliance
        run: reuse lint

  rust-fmt:
    name: Rust Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  rust-lint:
    name: Rust Lint
    needs: license
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            triplet: x64-linux
          - os: macos-latest
            triplet: arm64-osx
    env:
      RUSTFLAGS: ${{ matrix.os == 'ubuntu-24.04' && '-C linker=cc' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: "vcpkg-${{ matrix.triplet }}-${{ hashFiles('**/Cargo.lock') }}"

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libhdf5-dev pkg-config nasm

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install hdf5@1.10 nasm ffmpeg
          echo "HDF5_DIR=$(brew --prefix hdf5@1.10)" >> $GITHUB_ENV

      - name: Cache vcpkg
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        id: cache-vcpkg
        with:
          path: ${{ github.workspace }}/vcpkg
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

      - name: Clone and bootstrap vcpkg
        if: runner.os == 'Linux' && steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg --depth 1 ${{ github.workspace }}/vcpkg
          BASELINE=$(jq -r '."builtin-baseline"' ${{ github.workspace }}/vcpkg.json)
          git -C ${{ github.workspace }}/vcpkg fetch --depth 1 origin "$BASELINE"
          git -C ${{ github.workspace }}/vcpkg checkout "$BASELINE"
          ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh

      - name: Install vcpkg packages
        if: runner.os == 'Linux' && steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          ${{ github.workspace }}/vcpkg/vcpkg install --triplet ${{ matrix.triplet }} --x-manifest-root=${{ github.workspace }} --x-install-root=${{ github.workspace }}/vcpkg/installed

      - name: Configure vcpkg environment
        if: runner.os == 'Linux'
        run: |
          VCPKG_INSTALLED=${{ github.workspace }}/vcpkg/installed
          # Export for current step and future steps
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${VCPKG_INSTALLED}/${{ matrix.triplet }}/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=${VCPKG_INSTALLED}/${{ matrix.triplet }}/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
          echo "FFMPEG_PKG_CONFIG_PATH=${VCPKG_INSTALLED}/${{ matrix.triplet }}/lib/pkgconfig" >> $GITHUB_ENV
          echo "FFMPEG_INCLUDE_DIR=${VCPKG_INSTALLED}/${{ matrix.triplet }}/include" >> $GITHUB_ENV
          echo "FFMPEG_LIBS_DIR=${VCPKG_INSTALLED}/${{ matrix.triplet }}/lib" >> $GITHUB_ENV
          # Export for current step
          export PKG_CONFIG_PATH="${VCPKG_INSTALLED}/${{ matrix.triplet }}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          # Verify FFmpeg and x264 were installed correctly
          ls ${VCPKG_INSTALLED}/${{ matrix.triplet }}/lib/pkgconfig/libav*.pc
          ls ${VCPKG_INSTALLED}/${{ matrix.triplet }}/lib/pkgconfig/x264.pc
          pkg-config --modversion libavcodec x264

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  rust-test-macos:
    name: Rust Tests (macOS)
    needs: license
    runs-on: macos-latest
    env:
      HDF5_DIR: /opt/homebrew/opt/hdf5@1.10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: "vcpkg-arm64-osx-${{ hashFiles('**/Cargo.lock') }}"

      - name: Install system dependencies
        run: |
          brew install hdf5@1.10 nasm ffmpeg

      - name: Run tests
        run: cargo test --all-features

  rust-test-linux:
    name: Rust Tests (Linux)
    needs: license
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -C linker=cc
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: "vcpkg-x64-linux-${{ hashFiles('**/Cargo.lock') }}"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libhdf5-dev pkg-config nasm curl

      - name: Add required host aliases to /etc/hosts
        run: |
          if ! grep -qE '(^|\s)host\.docker\.internal(\s|$)' /etc/hosts; then
            echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
          fi
          if ! grep -qE '(^|\s)pd(\s|$)' /etc/hosts; then
            echo "127.0.0.1 pd" | sudo tee -a /etc/hosts
          fi
          echo "Configured host aliases:"
          grep -E 'host\.docker\.internal|(^|\s)pd(\s|$)' /etc/hosts

      - name: Cache vcpkg
        uses: actions/cache@v4
        id: cache-vcpkg
        with:
          path: ${{ github.workspace }}/vcpkg
          key: vcpkg-x64-linux-${{ hashFiles('vcpkg.json') }}

      - name: Clone and bootstrap vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg --depth 1 ${{ github.workspace }}/vcpkg
          BASELINE=$(jq -r '."builtin-baseline"' ${{ github.workspace }}/vcpkg.json)
          git -C ${{ github.workspace }}/vcpkg fetch --depth 1 origin "$BASELINE"
          git -C ${{ github.workspace }}/vcpkg checkout "$BASELINE"
          ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh

      - name: Install vcpkg packages
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          ${{ github.workspace }}/vcpkg/vcpkg install --triplet x64-linux --x-manifest-root=${{ github.workspace }} --x-install-root=${{ github.workspace }}/vcpkg/installed

      - name: Configure vcpkg environment
        run: |
          VCPKG_INSTALLED=${{ github.workspace }}/vcpkg/installed
          # Export for current step and future steps
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${VCPKG_INSTALLED}/x64-linux/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=${VCPKG_INSTALLED}/x64-linux/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
          echo "FFMPEG_PKG_CONFIG_PATH=${VCPKG_INSTALLED}/x64-linux/lib/pkgconfig" >> $GITHUB_ENV
          echo "FFMPEG_INCLUDE_DIR=${VCPKG_INSTALLED}/x64-linux/include" >> $GITHUB_ENV
          echo "FFMPEG_LIBS_DIR=${VCPKG_INSTALLED}/x64-linux/lib" >> $GITHUB_ENV
          # Export for current step
          export PKG_CONFIG_PATH="${VCPKG_INSTALLED}/x64-linux/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          ls ${VCPKG_INSTALLED}/x64-linux/lib/pkgconfig/libav*.pc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull Docker images
        run: docker compose pull --quiet

      - name: Start infrastructure services
        run: docker compose up -d minio minio-init pd tikv

      - name: Wait for services to be healthy
        timeout-minutes: 5
        run: |
          echo "Waiting for services to be healthy..."
          for i in {1..30}; do
            output=$(docker compose ps)

            pd_healthy=0
            tikv_healthy=0
            minio_healthy=0

            # Check PD
            if echo "$output" | grep "roboflow-pd" | grep -q "healthy"; then
              pd_healthy=1
              echo "  [ok] pd"
            fi

            # Check TiKV
            if echo "$output" | grep "roboflow-tikv" | grep -q "healthy"; then
              tikv_healthy=1
              echo "  [ok] tikv"
            fi

            # Check MinIO
            if echo "$output" | grep "roboflow-minio" | grep -q "healthy"; then
              minio_healthy=1
              echo "  [ok] minio"
            fi

            if [ "$pd_healthy" -eq 1 ] && [ "$tikv_healthy" -eq 1 ] && [ "$minio_healthy" -eq 1 ]; then
              echo "All services are healthy!"
              docker compose ps
              exit 0
            fi

            echo "Waiting... (attempt $i/30)"
            sleep 10
          done

          echo "Services not healthy after timeout"
          docker compose ps
          echo ""
          echo "=== PD logs ==="
          docker compose logs pd --tail 50 || true
          echo ""
          echo "=== TiKV logs ==="
          docker compose logs tikv --tail 50 || true
          exit 1

      - name: Verify service connectivity
        run: |
          echo "Verifying PD connectivity..."
          pd_ok=0
          for i in {1..30}; do
            if curl -sf http://localhost:2379/health > /dev/null 2>&1 && curl -sf http://pd:2379/health > /dev/null 2>&1; then
              echo "PD is healthy"
              pd_ok=1
              break
            fi
            echo "Waiting for PD... ($i/30)"
            sleep 2
          done
          if [ "$pd_ok" -ne 1 ]; then
            echo "PD failed readiness checks" >&2
            docker compose ps
            docker compose logs pd --tail 100 || true
            exit 1
          fi

          echo "Verifying TiKV connectivity..."
          tikv_ok=0
          for i in {1..30}; do
            if curl -sf http://localhost:20180/status > /dev/null 2>&1; then
              echo "TiKV is healthy"
              tikv_ok=1
              break
            fi
            echo "Waiting for TiKV... ($i/30)"
            sleep 2
          done
          if [ "$tikv_ok" -ne 1 ]; then
            echo "TiKV failed readiness checks" >&2
            docker compose ps
            docker compose logs tikv --tail 100 || true
            exit 1
          fi

          echo "Verifying MinIO connectivity..."
          minio_ok=0
          for i in {1..30}; do
            if curl -sf http://localhost:9000/minio/health/ready > /dev/null 2>&1; then
              echo "MinIO is healthy"
              minio_ok=1
              break
            fi
            echo "Waiting for MinIO... ($i/30)"
            sleep 2
          done
          if [ "$minio_ok" -ne 1 ]; then
            echo "MinIO failed readiness checks" >&2
            docker compose ps
            docker compose logs minio --tail 100 || true
            exit 1
          fi

      - name: Generate coverage and run tests
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          flags: rust
          name: codecov-umbrella

      - name: Cleanup TiKV services
        if: always()
        run: docker compose down -v

  security:
    name: Security Audit
    needs: license
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-deny
        uses: actions/cache@v4
        id: cache-deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny

      - name: Check dependencies for security advisories
        run: cargo deny check advisories

      - name: Check dependencies for license compliance
        run: cargo deny check licenses

      - name: Check for duplicate dependencies
        run: cargo deny check bans
