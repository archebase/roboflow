name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-lint:
    name: Rust Lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run fmt check
        run: cargo fmt -- --check

      - name: Install HDF5
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libhdf5-dev
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install hdf5
          fi
        shell: bash

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  rust-test:
    name: Rust Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install HDF5
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libhdf5-dev
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install hdf5
          fi
        shell: bash

      - name: Run tests
        run: cargo test --all-features

  python:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin[patchelf]
        if: runner.os != 'Windows'

      - name: Install maturin (Windows)
        run: pip install maturin
        if: runner.os == 'Windows'

      - name: Build and install Python package
        run: maturin build --release --features python --strip && pip install target/wheels/robocodec*.whl

      - name: Install pytest
        run: pip install pytest pytest-cov

      - name: Run Python tests
        run: pytest python/ -v

  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin[patchelf] mypy

      - name: Build and install Python package
        run: maturin build --release --features python --strip && pip install target/wheels/robocodec*.whl

      - name: Run mypy
        run: mypy python/robocodec

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Install maturin and pytest
        run: pip install maturin[patchelf] pytest pytest-cov

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Generate Rust coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Generate Python coverage
        run: |
          maturin build --release --features python --strip
          pip install target/wheels/robocodec*.whl
          pytest python/ --cov=robocodec --cov-report=xml:coverage-python.xml --cov-report=term

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info,./coverage-python.xml
          flags: rust,python
          name: codecov-umbrella
