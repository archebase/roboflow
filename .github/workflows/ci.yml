name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C linker=cc

jobs:
  license:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install reuse tool
        run: pip install reuse

      - name: Check REUSE compliance
        run: reuse lint

  rust-lint:
    name: Rust Lint
    needs: license
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Invalidate cache when robocodec git dependency changes
          cache-key: "robocodec-${{ hashFiles('**/Cargo.lock') }}"

      - name: Check formatting (Rust)
        run: cargo fmt -- --check

      - name: Install system dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libhdf5-dev ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev libswresample-dev libavdevice-dev pkg-config
          elif [ "$RUNNER_OS" == "macOS" ]; then
            # Use HDF5 1.10 as hdf5-sys doesn't support HDF5 2.x yet
            brew install hdf5@1.10 ffmpeg
            echo "HDF5_DIR=$(brew --prefix hdf5@1.10)" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  rust-test:
    name: Rust Tests
    needs: rust-lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Invalidate cache when robocodec git dependency changes
          cache-key: "robocodec-${{ hashFiles('**/Cargo.lock') }}"

      - name: Install system dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libhdf5-dev ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev libswresample-dev libavdevice-dev pkg-config
          elif [ "$RUNNER_OS" == "macOS" ]; then
            # Use HDF5 1.10 as hdf5-sys doesn't support HDF5 2.x yet
            brew install hdf5@1.10 ffmpeg
            echo "HDF5_DIR=$(brew --prefix hdf5@1.10)" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Run tests
        run: cargo test --features dataset-all

  coverage:
    name: Coverage
    needs: rust-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          # Invalidate cache when robocodec git dependency changes
          cache-key: "robocodec-${{ hashFiles('**/Cargo.lock') }}"

      - name: Cache cargo-llvm-cov
        uses: actions/cache@v4
        id: cache-llvm-cov
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: ${{ runner.os }}-cargo-llvm-cov-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-llvm-cov
        if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev libswresample-dev libavdevice-dev pkg-config

      - name: Generate Rust coverage
        run: cargo llvm-cov --features dataset-all --workspace --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          flags: rust
          name: codecov-umbrella

  security:
    name: Security Audit
    needs: license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-deny
        uses: actions/cache@v4
        id: cache-deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny

      - name: Check dependencies for security advisories
        run: cargo deny check advisories

      - name: Check dependencies for license compliance
        run: cargo deny check licenses

      - name: Check for duplicate dependencies
        run: cargo deny check bans
