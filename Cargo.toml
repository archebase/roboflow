[workspace]
members = [
    ".",
    "crates/roboflow-core",
    "crates/roboflow-storage",
    "crates/roboflow-distributed",
    "crates/roboflow-dataset",
    "crates/roboflow-hdf5",
    "crates/roboflow-pipeline",
]
resolver = "2"

[workspace.dependencies]
# Internal crates
roboflow-core = { path = "crates/roboflow-core", version = "0.2.0" }
roboflow-storage = { path = "crates/roboflow-storage", version = "0.2.0" }
roboflow-distributed = { path = "crates/roboflow-distributed", version = "0.2.0" }
roboflow-dataset = { path = "crates/roboflow-dataset", version = "0.2.0" }
roboflow-hdf5 = { path = "crates/roboflow-hdf5", version = "0.2.0" }
roboflow-pipeline = { path = "crates/roboflow-pipeline", version = "0.2.0" }

# External dependencies
robocodec = { git = "https://github.com/archebase/robocodec", rev = "5a8e11b" }

[package]
name = "roboflow"
version = "0.2.0"
edition = "2024"
authors = ["Strata Contributors"]
license = "MulanPSL-2.0"
repository = "https://github.com/archebase/roboflow"
description = "Schema-driven message codec supporting CDR, protobuf, and JSON"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
robocodec = { workspace = true }
roboflow-core = { workspace = true }
roboflow-storage = { workspace = true }
roboflow-dataset = { workspace = true }
roboflow-pipeline = { workspace = true }
roboflow-distributed = { workspace = true, optional = true }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
pest = "2.7"
pest_derive = "2.7"
byteorder = "1.5"
memmap2 = "0.9"
prost = "0.13"
prost-types = "0.13"
prost-reflect = "0.14"
hex = "0.4"
toml = "0.8"
regex = "1.10"

# Parallel processing
rayon = "1.10"
crossbeam-channel = "0.5"
crossbeam = "0.8"
crossbeam-queue = "0.3"

# Low-level system calls (for madvise on macOS)
libc = "0.2"

# System detection
num_cpus = "1.16"
sysinfo = "0.30"
raw-cpuid = { version = "11.0", optional = true }
hostname = "0.4"

# Compression
zstd = "0.13"
lz4_flex = "0.11"
bzip2 = "0.4"
crc32fast = "1.4"

# ROS bag and MCAP format support
mcap = "0.24"
rosbag = "0.6"

# Arena allocation for zero-copy pipeline
bumpalo = "3.16"
bytemuck = "1.15"
chrono = { version = "0.4", features = ["serde"] }

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cloud storage support (optional, gated by "cloud-storage" feature)
object_store = { version = "0.11", optional = true, features = ["aws"] }
tokio = { version = "1.40", optional = true, features = ["rt-multi-thread", "sync"] }
url = { version = "2.5", optional = true }
bytes = { version = "1.7", optional = true }

# TiKV distributed coordination (optional, gated by "distributed" feature)
tikv-client = { version = "0.3", optional = true }
futures = { version = "0.3", optional = true }
bincode = { version = "1.3", optional = true }

# KPS support (optional dependencies)
hdf5 = { git = "https://github.com/archebase/hdf5-rs", optional = true }
polars = { version = "0.41", features = ["parquet"], optional = true }
png = { version = "0.17", optional = true }
uuid = { version = "1.10", features = ["v4", "serde"] }

# Memory allocator (optional, for better concurrent performance on Linux)
tikv-jemallocator = { version = "0.6", optional = true }

# PyO3 for Python bindings (optional, gated by "python" feature)
# Note: extension-module is included here to prevent libpython linking
pyo3 = { version = "0.25", features = ["abi3-py311", "extension-module"], optional = true }

# CLI argument parsing (used by profiler and other binaries)
clap = { version = "4.5", features = ["derive"], optional = true }

# Profiling support (optional, for profiler binary)
pprof = { version = "0.14", features = ["flamegraph", "cpp", "prost-codec", "frame-pointer"], optional = true }

# io_uring for Linux async I/O (optional, Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7", optional = true }

# Dataset features (optional, disabled by default)
[features]
dataset-hdf5 = ["dep:hdf5"]
dataset-parquet = ["dep:polars"]
dataset-depth = ["dep:png"]
dataset-all = ["dataset-hdf5", "dataset-parquet", "dataset-depth"]
# Cloud storage support for Alibaba OSS and S3-compatible backends
cloud-storage = ["dep:object_store", "dep:tokio", "dep:url", "dep:bytes"]
# Distributed coordination via TiKV
distributed = ["dep:roboflow-distributed", "dep:tikv-client", "dep:futures", "dep:tokio", "dep:bincode"]
# Python bindings via PyO3 (extension-module mode to prevent libpython linking)
python = ["pyo3", "robocodec/python"]
# Python extension module (alias for python, since extension-module is now default)
extension-module = ["python"]
# GPU compression (experimental)
# Enables GPU-accelerated compression via nvCOMP
# Requires: NVIDIA GPU, CUDA toolkit, nvCOMP library (Linux)
gpu = []
# Use jemalloc as global allocator on Linux (better for concurrent workloads)
# On macOS, the default allocator is already excellent and jemalloc is not used
jemalloc = ["dep:tikv-jemallocator", "robocodec/jemalloc"]
# CLI support for binaries (profiler, etc.)
cli = ["dep:clap"]
# Profiling support for profiler binary (flamegraph generation)
profiling = ["dep:pprof", "cli"]
# CPU-aware WindowLog detection using CPUID (x86_64 only)
cpuid = ["dep:raw-cpuid"]
# io_uring support for Linux (high-performance async I/O)
# Requires: Linux 5.6+ kernel
io-uring-io = ["dep:io-uring"]
# Distributed tests (requires TiKV dependencies)
test-distributed = ["dep:roboflow-distributed"]

[dev-dependencies]
pretty_assertions = "1.4"
paste = "1.0"
criterion = "0.5"
tempfile = "3.10"
roboflow-hdf5 = { workspace = true }
roboflow-distributed = { workspace = true }

# Binaries
[[bin]]
name = "convert"
path = "src/bin/convert.rs"

[[bin]]
name = "extract"
path = "src/bin/extract.rs"

[[bin]]
name = "inspect"
path = "src/bin/inspect.rs"

[[bin]]
name = "schema"
path = "src/bin/schema.rs"

[[bin]]
name = "search"
path = "src/bin/search.rs"

[[bin]]
name = "roboflow"
path = "src/bin/roboflow.rs"
required-features = ["distributed"]

# Benchmarks
[[bench]]
name = "profiler"
path = "benches/profiler.rs"
harness = false
required-features = ["profiling"]

# Examples
[[example]]
name = "lerobot_convert"
path = "examples/rust/lerobot_convert.rs"
required-features = ["dataset-parquet"]

[[example]]
name = "lerobot_bench"
path = "examples/rust/lerobot_bench.rs"
required-features = ["dataset-parquet"]

[profile.release]
debug = true
