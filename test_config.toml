# LeRobot dataset configuration for rubbish sorting robot
[dataset]
name = "rubbish_sorting_p4_278"
fps = 30

# Camera mappings
[[mappings]]
topic = "/cam_h/color/image_raw/compressed"
feature = "observation.images.cam_high"
mapping_type = "image"

[[mappings]]
topic = "/cam_l/color/image_raw/compressed"
feature = "observation.images.cam_left"
mapping_type = "image"

[[mappings]]
topic = "/cam_r/color/image_raw/compressed"
feature = "observation.images.cam_right"
mapping_type = "image"

# Joint state observation
[[mappings]]
topic = "/kuavo_arm_traj"
feature = "observation.state"
mapping_type = "state"

# Action (joint command)
[[mappings]]
topic = "/joint_cmd"
feature = "action"
mapping_type = "action"

[video]
codec = "libx264"
crf = 18
preset = "fast"
